bases:
  - "configs/base.yaml"
  - "configs/g2p.yaml"

binarizer:
  phoneme_timing_data_dir: "data/phones"
  text_only_data_dir: "data/texts"
  vocabulary:
    global_symbols: [AP, SP, EP, GS, sil, br, pau, cl]
    stop_symbols: [AP, SP, EP, GS, sil, br, pau, cl]
    merged_groups: []
    peers: []

model:
  arch: ForcedAlignmentModel
  embedding_dim: 256
  out_dim: 256
  max_vocab_size: 256
  backbone:
    cls: modules.backbones.jebf.JEBFBackbone
    kwargs:
      dim: 256
      num_layers: 8
      num_heads: 8
      head_dim: 64
      attn_type: joint
      ffn_type: glu
      qk_norm: true
      use_rope: true

training:
  dataloader:
    aux_multiplier: 1.0
    aux_warmup_epochs: 10
  augmentation:
    sequence_edit:
      enabled: true
      prob: 0.3
      p_sub: 0.08
      p_del: 0.05
      p_ins: 0.05
    token_masking:
      enabled: true
      prob: 0.2
      p_mask: 0.5
  loss:
    frame_alignment:
      weight: 1.0
      temperature: 0.1
    span_contrastive:
      weight: 1.0
      temperature: 0.1
      bidirectional: true
    token_identity:
      weight: 1.0
    frame_identity:
      weight: 1.0
  validation:
    metrics_ber_tolerance: 5
    metrics_k_values: [20]
    metrics_conjunction_k_values: [20]
    metrics_determinacy_power: 2.0
    metrics_determinacy_width: 5
