bases:
  - "configs/base.yaml"

binarizer:
  phoneme_timing_data_dir: "data/phones"
  text_only_data_dir: "data/texts"
  g2p:
    preprocessors:
      - id: punctuation_filter
      - id: strip_whitespace
    tokenizers:
      - id: cjk
    converters:
      - id: mandarin
        kwargs:
          dict_path: "dictionaries/ds-zh-pinyin-lite.txt"
  vocabulary:
    global_symbols: [AP, SP, EP, GS, sil, br, pau, cl]
    stop_symbols: [AP, SP, EP, GS, sil, br, pau, cl]
    merged_groups: []
    replaceable_clusters: []

model: {}

training:
  dataloader:
    aux_multiplier: 1.0
  augmentation:
    sequence_edit:
      enabled: false
      prob: 0.3
      p_sub: 0.08
      p_del: 0.08
      p_ins: 0.05
    time_stretching:
      enabled: false
  loss: {}
  validation: {}
