bases: [
  "configs/base.yaml",
]

binarizer:
  data_dir: "data/phones"
  vocabulary:
    global_symbols: [AP, SP, EP, GS, sil, br, pau, cl]
    stop_symbols: [AP, SP, EP, GS, sil, br, pau, cl]
    merged_groups: []
    replaceable_clusters: []

model: {}

training:
  augmentation:
    pitch_shifting:
      enabled: true
      prob: 0.5
      min_semitones: -12
      max_semitones: 12
    loudness_scaling:
      enabled: true
      prob: 0.5
      min_db: -6
      max_db: 6
    spectrogram_masking:
      enabled: true
      time_mask_prob: 0.15
      time_mask_max_width: 50
      freq_mask_prob: 0.15
      freq_mask_max_width: 20
      intersect_prob: 0.5
    colored_noise:
      enabled: true
      prob: 0.25
      min_exponent: 0
      max_exponent: 2
    natural_noise:
      enabled: true
      prob: 0.25
      max_repeats: 3
      noise_path_glob: "data/noise/**/*.wav"
    rir_reverb:
      enabled: true
      prob: 0.25
      kernel_path_glob: "data/reverb/**/*.wav"
  loss: {}
  validation: {}
