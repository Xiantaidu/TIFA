binarizer:
  g2p:
    preprocessors:
      - id: filter-punctuation
      - id: strip-whitespace
      - id: lowercase
    converters:
      # Chinese: hanzi
      - id: chinese-pinyin
        kwargs:
          dict_path: "dictionaries/ds-zh-pinyin-lite.txt"
      # Japanese: kanji + kana
      - id: japanese-mecab
        kwargs:
          dict_path: "dictionaries/japanese_dict_full.txt"
          nbest: 32
          double_written_sokuon: false
      # English words take priority over pinyin/romaji in mixed-language text.
      - id: lstm
        language: en
        kwargs:
          dict_path: "dictionaries/ds_cmudict-07b.txt"
          model_path: "assets/LstmG2p-Eng"
          beam_size: 16
      # Chinese: pinyin
      - id: dictionary
        language: zh
        kwargs:
          dict_path: "dictionaries/ds-zh-pinyin-lite.txt"
      # Japanese: romaji
      - id: dictionary
        language: ja,jpn
        kwargs:
          dict_path: "dictionaries/japanese_dict_full.txt"
  vocabulary:
    prebuilt_vocab_file: null
    global_symbols: [AP, SP, EP, GS, sil, br, pau]
    stop_symbols: [AP, SP, EP, GS, sil, br, pau]
    merged_groups:
      - [ja/um, zh/um]
